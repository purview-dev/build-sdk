name: PR

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint & package
    uses: purview-dev/build/.github/workflows/purview-build.yml@main
    with:
      run-tests: false
    secrets: inherit

  tests:
    name: Tests (${{ matrix.project }})
    strategy:
      fail-fast: false
      matrix:
        # Every test project under src/tests. A project missing from this list is simply never run,
        # so keep it in step with the folder.
        project:
          - Analyzers.UnitTests.csproj
          - Analyzers.IntegrationTests.csproj
          - BuildSdk.IntegrationTests.csproj
          - SkillsTesting.UnitTests.csproj
    uses: purview-dev/build/.github/workflows/purview-build.yml@main
    with:
      run-lint: false
      run-pack: false
      validate-pack: false
      test-projects: ${{ matrix.project }}
    secrets: inherit
